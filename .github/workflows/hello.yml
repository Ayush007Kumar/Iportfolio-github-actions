#Goal: To say hello and tell the title/ Name of repository

#Start with naming your workflow
name: Hello Workflow

#when the workflow runs
on:
 push:
  

#what the workflow does
jobs:
#name of the workflow
  greet:
  #where the job runs (OS)
    runs-on: ubuntu-latest
    #the sequence of steps the job does
    steps:
      - name: Say hello
        run: echo "Hello Dosto"

  repo-name:
    runs_on: ubuntu:latest
    steps:
     - name: Show Repository Name
       run: echo "The repository name is : ${{ github.event.repository.name }}"
