name: Show environment variable

on:
 workflow_dispatch: 

env:
  NAME: ayush
jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: Show plain text env
        run: echo "My name is ${{ env.NAME }}"
      - name: Show Secrets
        run: echo "One fun secret ${{ secrets.AYUSH_SECRET }}"
      - name: Show Variables
        run: echo "My Dockerhub username is ${{ vars.DOCKERHUB_USERNAME }}"
   
